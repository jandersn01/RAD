<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <h1>Entrar</h1>

    <form action="" method="post" novalidate>
        {% csrf_token %}
        <input type="hidden" name="next" value = "{{request.GET.next}}">
        {% for field in form %}
            <div class="form-row">
                {{field.label_tag}}
                {{field}}
                {% if field.errors %}
                    <div class=" error">
                        {{field.errors}}
                    </div>
                {% endif %}

            </div>
        {%endfor %}

        <div class="form-actions">
            <button type="submit" class="btn">Entrar</button>

        </div>
    </form>
    <p>Não tem conta? <a href="{% url 'core:signup'%}">Cadastre-se</a></p>
    
</body>
</html>
